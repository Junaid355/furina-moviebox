<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="logo-bg-glow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.0" />
    </radialGradient>

    <!-- Hydro Droplet Gradient -->
    <linearGradient id="logo-hydro-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Crown Gold -->
    <linearGradient id="logo-crown-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Text Furina Cyan Gradient -->
    <linearGradient id="text-furina-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Text MovieBox Gradient -->
    <linearGradient id="text-moviebox-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect x="0" y="0" width="680" height="180" fill="url(#logo-bg-glow)" />

  <!-- EMBLEM: Left Side (Icon x=20..150, y=20..160) -->
  <g transform="translate(15, 10)">
    <!-- Medallion Base -->
    <rect x="10" y="10" width="140" height="140" rx="36" fill="#071126" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.6" filter="url(#logo-glow)" />
    
    <!-- Outer Decorative Concentric Hydro Ring -->
    <circle cx="80" cy="80" r="54" fill="none" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Hydro Droplet -->
    <path d="M 80 38 
             C 90 58, 118 84, 118 106 
             C 118 127, 101 142, 80 142 
             C 59 142, 42 127, 42 106 
             C 42 84, 70 58, 80 38 Z" 
          fill="url(#logo-hydro-grad)" />

    <!-- Droplet Facet -->
    <path d="M 80 40 
             L 92 88 
             L 80 140 
             L 68 88 Z" 
          fill="#ffffff" 
          opacity="0.4" />

    <!-- Play Arrow -->
    <polygon points="75,72 92,82 75,92" fill="#ffffff" opacity="0.95" />

    <!-- Furina Crown Motif on Droplet -->
    <path d="M 60 62 Q 80 54 100 62 Q 80 58 60 62 Z" fill="url(#logo-crown-gold)" stroke="#ca8a04" stroke-width="1" />
    <!-- Center Spike -->
    <path d="M 74 58 L 80 42 L 86 58 Z" fill="url(#logo-crown-gold)" />
    <!-- Feather Accent -->
    <path d="M 98 56 C 108 48, 114 36, 110 30 C 104 36, 102 46, 96 54 Z" fill="#e0f2fe" opacity="0.9" />

    <!-- Little Sparkle -->
    <path d="M 32 38 Q 38 38 38 32 Q 38 38 44 38 Q 38 38 38 44 Q 38 38 32 38 Z" fill="#67e8f9" opacity="0.9" />
  </g>

  <!-- TYPOGRAPHY: Center & Right -->
  <g transform="translate(190, 42)">
    <!-- "FURINA" Title -->
    <text x="0" y="52" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="52" 
          letter-spacing="-1" 
          fill="url(#text-furina-grad)">FURINA</text>

    <!-- "MOVIEBOX" Title -->
    <text x="215" y="52" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="52" 
          letter-spacing="-0.5" 
          fill="url(#text-moviebox-grad)">MOVIEBOX</text>

    <!-- Subtitle & Feature Tags Ribbon -->
    <g transform="translate(2, 74)">
      <!-- 4K ULTRA CINEMA Badge -->
      <rect x="0" y="0" width="138" height="24" rx="12" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="12" cy="12" r="3.5" fill="#38bdf8" />
      <text x="22" y="16.5" 
            font-family="system-ui, -apple-system, sans-serif" 
            font-weight="800" 
            font-size="11.5" 
            letter-spacing="0.8" 
            fill="#a5f3fc">4K ULTRA CINEMA</text>

      <!-- MULTI-DUB HUD Badge -->
      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="124" height="24" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1.2" />
        <text x="12" y="16.5" 
              font-family="system-ui, -apple-system, sans-serif" 
              font-weight="800" 
              font-size="11.5" 
              letter-spacing="0.5" 
              fill="#6ee7b7">🎙️ MULTI-DUB</text>
      </g>

      <!-- ZERO ADS / FAST CDN Badge -->
      <g transform="translate(282, 0)">
        <rect x="0" y="0" width="118" height="24" rx="12" fill="#8b5cf6" fill-opacity="0.2" stroke="#a78bfa" stroke-width="1.2" />
        <text x="12" y="16.5" 
              font-family="system-ui, -apple-system, sans-serif" 
              font-weight="800" 
              font-size="11.5" 
              letter-spacing="0.5" 
              fill="#c4b5fd">⚡ FAST CDN</text>
      </g>
    </g>
  </g>
</svg>
