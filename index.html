<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050811" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Furina MovieBox" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Furina MovieBox — 4K Free Movies & Web Series</title>
    <script>
      // Register modern Service Worker for PWA standalone installation on Android & Desktop
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').catch(function() {});
        });
      }
      // Capture PWA install prompt event for 1-tap in-app installation button
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('furina:can-install'));
      });
    </script>
    <script type="module" crossorigin src="./assets/index-DubkOsUS.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-aSVqlZWX.css">
  </head>
  <body class="bg-[#030712] text-white select-none overflow-x-hidden antialiased">
    <div id="root">
      <div id="initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #030712; color: #38bdf8; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 20px;">
        <div style="width: 76px; height: 76px; border-radius: 50%; overflow: hidden; border: 2.5px solid #38bdf8; box-shadow: 0 0 30px rgba(56,189,248,0.5); margin-bottom: 18px; animation: pulse 2s infinite ease-in-out;">
          <img src="./favicon.png" alt="Furina" style="width: 100%; height: 100%; object-fit: cover;" />
        </div>
        <h1 style="font-size: 22px; font-weight: 900; color: #fff; margin: 0 0 6px 0; letter-spacing: -0.5px;">Furina MovieBox</h1>
        <p style="font-size: 13px; color: #94a3b8; margin: 0 0 24px 0;">Loading 4K Cinema & Hindi Dubs...</p>
        <div style="width: 32px; height: 32px; border: 3px solid rgba(56,189,248,0.2); border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <div id="slow-network-fallback" style="display: none; margin-top: 24px;">
          <p style="font-size: 11px; color: #cbd5e1; margin-bottom: 10px;">Taking longer than usual?</p>
          <button onclick="window.location.reload(true)" style="padding: 8px 18px; border-radius: 9999px; background: #0284c7; color: #fff; border: 0; font-size: 12px; font-weight: 700; cursor: pointer;">🔄 Refresh Page</button>
        </div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
      </style>
    </div>
    <script>
      setTimeout(function() {
        var fallback = document.getElementById('slow-network-fallback');
        if (fallback) fallback.style.display = 'block';
      }, 3500);

      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.warn('Asset chunk failed, reloading...', e.target.src || e.target.href);
          if (!sessionStorage.getItem('furina_auto_reload')) {
            sessionStorage.setItem('furina_auto_reload', '1');
            window.location.reload();
          }
        }
      }, true);
    </script>
  </body>
</html>
