<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#142850" />
      <stop offset="50%" stop-color="#0a122c" />
      <stop offset="100%" stop-color="#030614" />
    </radialGradient>

    <!-- Glowing Cyan/Teal Hydro Gradient -->
    <linearGradient id="hydro-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Crystal Highlight Gradient -->
    <linearGradient id="facet-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0" />
    </linearGradient>

    <!-- Crown & Gold Filigree Gradient -->
    <linearGradient id="crown-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#facc15" />
      <stop offset="75%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Outer Rim Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Cinema Medallion -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.5" />
  <rect width="488" height="488" x="12" y="12" rx="116" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.8" stroke-dasharray="16 8" />

  <!-- Ambient Hydro Ripple Rings -->
  <circle cx="256" cy="270" r="190" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="2" />
  <circle cx="256" cy="270" r="150" fill="none" stroke="#67e8f9" stroke-opacity="0.18" stroke-width="3" />

  <!-- Background Glow behind Droplet -->
  <circle cx="256" cy="270" r="95" fill="#0284c7" filter="url(#glow-cyan)" opacity="0.45" />

  <!-- Crystalline Fontaine Hydro Droplet Base -->
  <path d="M 256 120 
           C 285 180, 370 260, 370 330 
           C 370 395, 319 440, 256 440 
           C 193 440, 142 395, 142 330 
           C 142 260, 227 180, 256 120 Z" 
        fill="url(#hydro-grad)" 
        filter="url(#soft-glow)" />

  <!-- Crystal Facet Left Flank -->
  <path d="M 256 126 
           C 230 190, 155 270, 155 330 
           C 155 375, 185 415, 230 432 
           L 256 280 Z" 
        fill="#0369a1" 
        opacity="0.75" />

  <!-- Crystal Facet Front Highlight -->
  <path d="M 256 128 
           L 290 280 
           L 256 436 
           L 222 280 Z" 
        fill="url(#facet-light)" />

  <!-- Prismatic Bright Specular Sheen (Top Left) -->
  <path d="M 256 135 
           C 240 180, 178 250, 178 310 
           C 178 340, 195 365, 215 375 
           C 195 345, 205 270, 256 135 Z" 
        fill="#ffffff" 
        opacity="0.65" />

  <!-- Play Symbol / Hydro Heart in Center of Droplet -->
  <polygon points="240,245 292,275 240,305" fill="#ffffff" opacity="0.95" filter="url(#soft-glow)" />

  <!-- Furina's Fontaine Archon Regal Hat & Crown Motif -->
  <!-- Crown Arc / Base Ribbon -->
  <path d="M 190 195 Q 256 175 322 195 Q 256 185 190 195 Z" fill="url(#crown-gold)" stroke="#ca8a04" stroke-width="2" />
  
  <!-- Crown Spikes / Fleur-de-lis -->
  <!-- Left Spire -->
  <path d="M 205 190 L 195 150 L 220 178 Z" fill="url(#crown-gold)" />
  <circle cx="195" cy="148" r="5" fill="#67e8f9" stroke="#facc15" stroke-width="1.5" />
  
  <!-- Right Spire -->
  <path d="M 307 190 L 317 150 L 292 178 Z" fill="url(#crown-gold)" />
  <circle cx="317" cy="148" r="5" fill="#67e8f9" stroke="#facc15" stroke-width="1.5" />
  
  <!-- Center Regal Crown Arch & Gemstone -->
  <path d="M 235 180 L 256 130 L 277 180 Z" fill="url(#crown-gold)" />
  <!-- Radiant Top Gemstone -->
  <path d="M 256 116 L 265 130 L 256 142 L 247 130 Z" fill="#ffffff" stroke="#38bdf8" stroke-width="2" filter="url(#soft-glow)" />

  <!-- Opera Feather Flourish (Furina's signature hat accent) -->
  <path d="M 315 175 C 345 155, 365 115, 350 95 C 335 110, 330 145, 310 170 Z" 
        fill="#e0f2fe" 
        opacity="0.9" 
        stroke="#38bdf8" 
        stroke-width="1.5" />
  <path d="M 312 170 C 335 140, 342 110, 336 98" fill="none" stroke="#67e8f9" stroke-width="2" />

  <!-- Crystalline Sparkles -->
  <!-- Sparkle 1 (Top Left) -->
  <path d="M 125 140 Q 140 140 140 125 Q 140 140 155 140 Q 140 140 140 155 Q 140 140 125 140 Z" fill="#67e8f9" opacity="0.9" />
  <!-- Sparkle 2 (Bottom Right) -->
  <path d="M 370 380 Q 382 380 382 368 Q 382 380 394 380 Q 382 380 382 392 Q 382 380 370 380 Z" fill="#38bdf8" opacity="0.8" />
  <!-- Sparkle 3 (Top Right Small) -->
  <circle cx="380" cy="160" r="4" fill="#ffffff" opacity="0.85" />
  <circle cx="130" cy="360" r="3.5" fill="#38bdf8" opacity="0.7" />
</svg>
